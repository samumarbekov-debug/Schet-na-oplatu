<script>
"use strict";
/* ============ Утилиты ============ */
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NB='\u00A0';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3200)}
/* Число из строки: "150 000,55" -> 150000.55; NaN при ошибке */
function num(s){const v=String(s??'').replace(/[\s\u00A0]/g,'').replace(',','.');return v===''?NaN:Number(v)}
/* Деньги храним целыми копейками */
const cents=v=>Math.round(v*100+1e-9);
function fmt(c){const i=Math.floor(c/100),f=c%100;return String(i).replace(/\B(?=(\d{3})+(?!\d))/g,NB)+','+String(f).padStart(2,'0')}
const fmtQty=q=>String(q).replace('.',',');
function ruDate(iso){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||'');return m?`${m[3]}.${m[2]}.${m[1]}`:(iso||'')}

/* ============ Сумма прописью ============ */
const OM=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'],
OF=['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'],
TN=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'],
TS=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'],
HS=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
function triad(n,f){const t=n%100,w=[HS[n/100|0]];if(t>=10&&t<20)w.push(TN[t-10]);else w.push(TS[t/10|0],(f?OF:OM)[t%10]);return w.filter(Boolean).join(' ')}
function plural(n,f){const m=n%100,r=n%10;if(m>10&&m<20)return f[2];return r===1?f[0]:(r>1&&r<5?f[1]:f[2])}
const SC=[null,['тысяча','тысячи','тысяч'],['миллион','миллиона','миллионов'],['миллиард','миллиарда','миллиардов']];
function words(c){
  let i=Math.floor(c/100);const k=c%100;let p=[],s=0,n=i;
  while(n>0){const g=n%1000;if(g){p.unshift(triad(g,s===1)+(s?' '+plural(g,SC[s]):''))}n=Math.floor(n/1000);s++}
  let t=(i===0?'ноль':p.join(' '))+' тенге '+String(k).padStart(2,'0')+' тиын.';
  return t[0].toUpperCase()+t.slice(1)}
/* Самопроверка (результат в консоли) */
(function(){const T=[[40032210,'Четыреста тысяч триста двадцать два тенге 10 тиын.'],[0,'Ноль тенге 00 тиын.'],[100,'Один тенге 00 тиын.'],[200101,'Две тысячи один тенге 01 тиын.'],[1100000,'Одиннадцать тысяч тенге 00 тиын.'],[100000000,'Один миллион тенге 00 тиын.'],[222200002,'Два миллиона двести двадцать две тысячи тенге 02 тиын.'],[99999999999999,'Девятьсот девяносто девять миллиардов девятьсот девяносто девять миллионов девятьсот девяносто девять тысяч девятьсот девяносто девять тенге 99 тиын.']];
T.forEach(([c,e])=>{if(words(c)!==e)console.warn('words() FAIL',c,words(c),'!=',e)})})();
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function ruLong(iso){const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||'');return m?`${+m[3]} ${MON[+m[2]-1]} ${m[1]}`:(iso||'')}
/* Проверки казахстанских реквизитов */
const V={bin:[/^\d{12}$/,'БИН/ИИН: 12 цифр'],cBin:[/^\d{12}$/,'БИН/ИИН: 12 цифр'],iik:[/^KZ[0-9A-Z]{18}$/i,'ИИК: 20 знаков, начинается с KZ'],bik:[/^[A-Z0-9]{8}$/i,'БИК: 8 знаков, например HSBKKZKX'],kbe:[/^\d{2}$/,'Кбе: 2 цифры'],knp:[/^\d{3}$/,'КНП: 3 цифры']};

function buildItems(){

  update()}

/* ============ Расчёты ============ */
function calc(){
  let total=0,bad=false;
  const rows=S.items.map(it=>{const q=num(it.qty),p=num(it.price);const ok=q>0&&p>=0&&!isNaN(q)&&!isNaN(p);const pc=ok?cents(p):0,sc=ok?Math.round(q*pc):0;total+=sc;
    return{it,q,pc,sc,ok,eq:isNaN(q)||q<=0,ep:isNaN(p)||p<0}});
  const pv=num(S.vat),vbad=isNaN(pv)||pv<0||pv>100,nv=!!S.nv||S.vat==='-',r=nv||vbad?0:pv;
  const g=S.pm==='gross',vat=nv?0:g?Math.round(total*r/(100+r)):Math.round(total*r/100+1e-9);
  return{rows,sub:g?total-vat:total,vat,total:g?total:total+vat,g,r,nv,vbad:vbad&&!nv,rs:String(r).replace('.',','),n:rows.filter(x=>x.it.name.trim()).length}}
/* Строки итогов: цены без НДС -> НДС добавляется сверху; всего = сумма с НДС */
const TL=C=>C.nv?[['Всего к оплате (без НДС):',C.total,1]]:C.g?[['Всего к оплате (с НДС '+C.rs+'%):',C.total,1],['в том числе НДС '+C.rs+'%:',C.vat]]:[['Итого без НДС:',C.sub],['НДС '+C.rs+'%:',C.vat],['Всего к оплате (с НДС):',C.total,1]];
const HD=C=>C.nv||C.g?['Цена, тг','Сумма, тг']:['Цена без НДС, тг','Сумма без НДС, тг'];

  const rows=C.rows.map((x,i)=>`<tr><td class="c">${i+1}</td><td>${E(x.it.name)}</td><td class="r">${isNaN(x.q)?'':fmtQty(x.q)}</td><td class="c">${E(x.it.unit)}</td><td class="r">${fmt(x.pc)}</td><td class="r">${fmt(x.sc)}</td></tr>`).join('');

/* ============ DOCX: ZIP без сжатия + CRC32 ============ */
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const enc=new TextEncoder(),out=[],cd=[],u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24];let off=0;
  for(const f of files){const nm=enc.encode(f.n),c=crc32(f.d),z=f.d.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(z),...u32(z),...u16(nm.length),...u16(0)]);
    out.push(lh,nm,f.d);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(z),...u32(z),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+z}
  const cs=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
  return new Blob([...out,...cd,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
const dataBytes=u=>Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0));

/* ============ DOCX: сборка document.xml ============ */
const R=(t,o={})=>`<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b?'<w:b/>':''}<w:sz w:val="${o.sz||20}"/></w:rPr><w:t xml:space="preserve">${E(t)}</w:t></w:r>`;
const P=(c='',o={})=>`<w:p><w:pPr>${o.bdr||''}<w:spacing w:before="${o.bf||0}" w:after="${o.af??40}"/><w:jc w:val="${o.jc||'left'}"/></w:pPr>${c}</w:p>`;
const TC=(w,c,o={})=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.gs?`<w:gridSpan w:val="${o.gs}"/>`:''}${o.vm?`<w:vMerge${o.vm==2?' w:val="restart"':''}/>`:''}${o.sh?`<w:shd w:val="clear" w:color="auto" w:fill="${o.sh}"/>`:''}<w:vAlign w:val="${o.va||'top'}"/></w:tcPr>${c||P()}</w:tc>`;
const TR=(c,h)=>`<w:tr><w:trPr><w:cantSplit/>${h?`<w:trHeight w:val="${h}" w:hRule="atLeast"/>`:''}</w:trPr>${c}</w:tr>`;
const BD=['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('');
const TB=(grid,rows,bord)=>`<w:tbl><w:tblPr><w:tblW w:w="${grid.reduce((a,b)=>a+b,0)}" w:type="dxa"/>${bord?`<w:tblBorders>${BD}</w:tblBorders>`:''}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="85"/><w:right w:w="85"/></w:tblCellMar></w:tblPr><w:tblGrid>${grid.map(g=>`<w:gridCol w:w="${g}"/>`).join('')}</w:tblGrid>${rows}</w:tbl>`;
function buildDocx(){
  const C=calc(),sm=t=>R(t,{sz:16}),pa=(n,i,a,t)=>[n,i&&`БИН/ИИН: ${i}`,a&&`адрес: ${a}`,t&&`тел.: ${t}`].filter(Boolean).join(', ');
  /* А) Платёжные реквизиты бенефициара: 5800+3000+1972 */
  const g1=[5800,3000,1972],cell=(w,t,o)=>TC(w,P(typeof t==='string'?t:''),o);
  const bank=TB(g1,
    TR(TC(5800,P(sm('Бенефициар:')))+TC(3000,P(sm('ИИК')))+TC(1972,P(sm('Кбе'))))+
    TR(TC(5800,P(R(S.name))+P(R('БИН/ИИН: '+S.bin)))+TC(3000,P(R(S.iik)),{va:'center'})+TC(1972,P(R(S.kbe)),{va:'center'}))+
    TR(TC(5800,P(sm('Банк бенефициара:')))+TC(3000,P(sm('БИК')))+TC(1972,P(sm('Код назначения платежа'))))+
    TR(TC(5800,P(R(S.bank)))+TC(3000,P(R(S.bik)))+TC(1972,P(R(S.knp)))),true);
  /* Б) Заголовок */
  const head=P(R(`Счет на оплату № ${S.num} от ${ruLong(S.date)} г.`,{b:1,sz:32}),{bf:360,af:120,bdr:'<w:pBdr><w:bottom w:val="single" w:sz="24" w:space="4" w:color="000000"/></w:pBdr>'});
  /* В) Поставщик / Покупатель / Договор */
  const ir=(l,t)=>TR(TC(1500,P(R(l)))+TC(9272,P(R(t,{b:1}))));
  const info=TB([1500,9272],ir('Поставщик:',pa(S.name,S.bin,S.addr,S.tel))+ir('Покупатель:',pa(S.cName,S.cBin,S.cAddr,S.cTel))+(S.basis.trim()?ir('Договор:',S.basis):''),false);
  /* Г) Позиции */
  const g2=[500,4172,900,800,2100,2300],A=['center','left','right','center','right','right'];
  const th=TR(['№','Наименование работ, услуг','Кол-во','Ед. изм.',...HD(C)].map((t,i)=>TC(g2[i],P(R(t,{b:1}),{jc:'center'}),{va:'center'})).join(''));
  const body=C.rows.map((x,i)=>TR([String(i+1),x.it.name,isNaN(x.q)?'':fmtQty(x.q),x.it.unit,fmt(x.pc),fmt(x.sc)].map((t,j)=>TC(g2[j],P(R(t),{jc:A[j]}))).join(''))).join('');
  const items=TB(g2,th+body,true);
  /* Д), Е) Итоги, сумма прописью */
  const tl=C.nv?'Итого к оплате (без НДС):':`Итого к оплате (вкл. НДС ${C.rs}%):`;
  const tot=TL(C).map(([l,v,b],i)=>P(R(l,{b:1})+R('   '+fmt(v),{b}),{jc:'right',bf:i?0:200})).join('');
  const txt=P(R(`Всего наименований ${C.n}, на сумму ${fmt(C.total)} тенге.`),{bf:300,af:20})+P(R(words(C.total),{b:1}),{af:200})+P(R(S.note),{af:200});
  /* Ж) Подписи: линия для подписи, «М.П.» оставлено для печати вручную */
  const ul='<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="000000"/></w:pBdr>',g3=[2800,2400,5572];
  const acc=S.accName.trim(),nm=n=>n.trim()?'/ '+n+' /':'';
  const r1=TR(TC(2800,P(R(S.dirPos)),{va:'bottom'})+TC(2400,P('',{bdr:ul}),{va:'bottom'})+TC(5572,P(R(nm(S.dirName))),{va:'bottom'}),800);
  const r2=acc?TR(TC(2800,P(R('Главный бухгалтер')),{va:'bottom'})+TC(2400,P('',{bdr:ul}),{va:'bottom'})+TC(5572,P(R(nm(S.accName))),{va:'bottom'}),800):'';
  const line=P('',{bdr:'<w:pBdr><w:top w:val="single" w:sz="16" w:space="1" w:color="000000"/></w:pBdr>',bf:200,af:560});
  const sg=TB(g3,r1+r2,false);
  const sp=P('',{af:0});
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${bank}${head}${info}${sp}${items}${tot}${txt}${line}${sg}${sp}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="567" w:right="567" w:bottom="567" w:left="567" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',te=new TextEncoder();
  return zip([
    {n:'[Content_Types].xml',d:te.encode(X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')},
    {n:'_rels/.rels',d:te.encode(X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')},
    {n:'word/document.xml',d:te.encode(doc)},
    {n:'word/_rels/document.xml.rels',d:te.encode(X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>')}])}

/* ============ Сохранение ============ */
function chk(){
  document.querySelectorAll('#form input[required]').forEach(i=>i.classList.add('t'));
  const miss=[...document.querySelectorAll('#form input[required]')].find(i=>!i.value.trim());
  if(miss){miss.closest('details').open=true;miss.focus();return toast('Заполните обязательные поля (отмечены *)')}
  const bk=Object.keys(V).find(k=>S[k]&&!V[k][0].test(S[k]));
  if(bk){const el=$('#f_'+bk);el.closest('details').open=true;el.classList.add('bad');el.focus();return toast(V[bk][1])}
  const C=calc();
  if(C.vbad){$('#f_vat').closest('details').open=true;$('#f_vat').focus();return toast('Ставка НДС: число от 0 до 100')}
  if(!C.rows.some(x=>x.it.name.trim()&&x.ok))return toast('Добавьте хотя бы одну позицию с названием, количеством и ценой');
  if(C.rows.some(x=>x.it.name.trim()&&!x.ok))return toast('Проверьте количество и цену: нужны положительные числа');
  return 1}
$('#bSave2').onclick=()=>{if(!chk())return;
  try{const blob=buildDocx(),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`Счет_№${S.num}_${ruDate(S.date)}.docx`.replace(/[\\/:*?"<>|]/g,'-');
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Файл .docx сохранён, счёт в архиве');arch('docx')}
  catch(e){console.error(e);toast('Ошибка при создании файла: '+e.message)}};

/* ============ Справочник компаний (хранится в браузере) ============ */
const CK='invoice_kz_companies_v1',CF=[['name','Наименование','r'],['bin','БИН / ИИН'],['addr','Адрес'],['tel','Телефон'],['bank','Банк'],['bik','БИК'],['iik','ИИК'],['kbe','Кбе'],['knp','КНП'],['dirPos','Должность руководителя'],['dirName','ФИО руководителя'],['accName','ФИО главного бухгалтера']];
const MAP={s:{name:'name',bin:'bin',addr:'addr',tel:'tel',bank:'bank',bik:'bik',iik:'iik',kbe:'kbe',knp:'knp',dirPos:'dirPos',dirName:'dirName',accName:'accName'},b:{name:'cName',bin:'cBin',addr:'cAddr',tel:'cTel'}};
let CO=[],ED=null;try{CO=JSON.parse(localStorage.getItem(CK)||'[]')}catch(e){}
const saveCO=()=>{try{localStorage.setItem(CK,JSON.stringify(CO))}catch(e){toast('Не удалось сохранить в браузере')}};
const pk=r=>`<div class="pk"><select data-pick="${r}"></select></div>`;
function fillPick(){document.querySelectorAll('[data-pick]').forEach(x=>{x.innerHTML='<option value="">Выбрать сохранённую компанию…</option>'+CO.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('')})}
function pick(r,id){const c=CO.find(x=>x.id===id);if(!c)return;for(const[k,sk]of Object.entries(MAP[r])){S[sk]=c[k]||(['kbe','knp','dirPos'].includes(k)?blank()[sk]:'');const el=$('#f_'+sk);if(el){el.value=S[sk];el.classList.remove('bad')}}update()}
function impCO(txt){let a=JSON.parse(txt),ar=[];if(!Array.isArray(a)){ar=Array.isArray(a.archive)?a.archive:[];a=a.companies}if(!Array.isArray(a))a=[];if(!a.length&&!ar.length)throw 0;let n=0;
  a.forEach((o,k)=>{if(!o||!String(o.name||'').trim())return;const c={};CF.forEach(([key])=>c[key]=String(o[key]??'').trim());
    const ex=CO.find(x=>(c.bin&&x.bin===c.bin)||x.name===c.name);if(ex)Object.assign(ex,c);else CO.push({id:'c'+Date.now()+k,...c});n++});
  saveCO();fillPick();const m=mergeAr(ar);if(!$('#mod').hidden)VIEW==='ar'?showAr():showList();toast('Загружено: компаний '+n+', счетов в архиве '+m)}
function showList(){VIEW='co';$('#mc').innerHTML=`<h3>Мои компании</h3>${CO.length?CO.map(c=>`<div class="co"><div><b>${E(c.name)}</b><br><small>${E([c.bin&&'БИН '+c.bin,c.addr].filter(Boolean).join(' · '))}</small></div><button class="add" data-ed="${c.id}" title="Редактировать">Изм.</button><button class="x" data-rm="${c.id}" title="Удалить">✕</button></div>`).join(''):'<p>Пока пусто. Добавьте первую компанию.</p>'}<div class="bar2"><button class="main" data-ed="new">+ Добавить компанию</button><button class="add" data-close>Закрыть</button></div>`}
function showEd(id,pre){const c=pre||CO.find(x=>x.id===id)||{};ED=id;$('#mc').innerHTML=`<h3>${id?'Редактирование компании':'Новая компания'}</h3><div class="bd">${CF.map(([k,l,r])=>`<div class="fl ${r?'req':''}"><input data-c="${k}" placeholder=" " value="${E(c[k])}"><label>${l}</label></div>`).join('')}</div><div class="bar2"><button class="main" data-csave>Сохранить</button><button class="add" data-clist>Назад к списку</button></div>`}
let OV=false;$('#mod').addEventListener('pointerdown',e=>{OV=e.target.id==='mod'});
$('#mod').addEventListener('click',e=>{const t=e.target.closest('button'),d=t&&t.dataset;
  if((e.target.id==='mod'&&OV)||(d&&'close' in d)){$('#mod').hidden=true;return}if(!t)return;
  if(d.ed)showEd(d.ed==='new'?null:d.ed);
  else if(d.rm){if(confirm('Удалить компанию из справочника?')){CO=CO.filter(x=>x.id!==d.rm);saveCO();fillPick();showList()}}
  else if('exp' in d){if(!CO.length&&!AR.length)return toast('Справочник и архив пусты');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,companies:CO,archive:AR},null,2)],{type:'application/json'}));a.download='kompanii-i-arhiv.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Сохранено: компаний '+CO.length+', счетов в архиве '+AR.length)}
  else if('imp' in d){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const fr=new FileReader();fr.onload=()=>{try{impCO(fr.result)}catch(x){toast('Не удалось прочитать файл: нужен JSON со списком компаний')}};fr.readAsText(i.files[0])};i.click()}
  else if('clist' in d)showList();
  else if('csave' in d){const c={};document.querySelectorAll('#mc [data-c]').forEach(i=>c[i.dataset.c]=i.value.trim());
    if(!c.name)return toast('Введите наименование');
    const bad=Object.keys(V).find(k=>c[k]&&!V[k][0].test(c[k]));if(bad)return toast(V[bad][1]);
    if(ED)Object.assign(CO.find(x=>x.id===ED),c);else CO.push({id:'c'+Date.now(),...c});
    saveCO();fillPick();showList();toast('Компания сохранена')}});
form.addEventListener('change',e=>{const r=e.target.dataset.pick;if(r&&e.target.value){pick(r,e.target.value);e.target.value=''}});
form.addEventListener('click',e=>{if(e.target.closest('button[data-mng]')){$('#mod').hidden=false;showList();return}const t=e.target.closest('button[data-save]');if(!t)return;const r=t.dataset.save,c={};
  for(const[k,sk]of Object.entries(MAP[r]))c[k]=S[sk]||'';
  const ex=c.bin&&CO.find(x=>x.bin===c.bin);$('#mod').hidden=false;showEd(ex?ex.id:null,{...(ex||{}),...c})});
$('#bAddCo').onclick=()=>{$('#mod').hidden=false;showList()};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#mod').hidden=true});


/* ============ Архив и шифр счёта ============ */
let AR=[],VIEW='co';const AK='invoice_kz_archive_v1';
try{AR=JSON.parse(localStorage.getItem(AK)||'[]');if(!Array.isArray(AR))AR=[]}catch(e){AR=[]}
const saveAr=()=>{try{localStorage.setItem(AK,JSON.stringify(AR))}catch(e){toast('Не удалось сохранить архив в браузере')}};
function cipher(base){let h=0;for(const ch of base)h=(h*31+ch.charCodeAt(0))%9973;return 'ABCDEFGHJKLMNPQRSTUVWXYZ'[h%24]}
function nextNum(d){d=d||new Date().toISOString().slice(0,10);const ym=d.slice(2,4)+d.slice(5,7),re=new RegExp('^(?:SCH-)?'+ym+'-(\\d+)');
  let mx=0;AR.forEach(x=>{const m=re.exec(x.code||'');if(m)mx=Math.max(mx,+m[1])});const b=ym+'-'+String(mx+1).padStart(3,'0');return b+'ABCDEFGHJKLMNPQRSTUVWXYZ'[mx%24]}
function arch(kind){const C=calc(),e={code:S.num,ts:Date.now(),date:S.date,buyer:S.cName||'',supplier:S.name||'',total:fmt(C.total)+' тг',kind,s:JSON.parse(JSON.stringify({...S,img:{}}))};
  const i=AR.findIndex(x=>x.code===e.code);if(i>=0)AR[i]=e;else AR.unshift(e);saveAr()}
const renum=()=>{if(!AR.some(x=>x.code===S.num)){S.num=nextNum(S.date);const f=$('#f_num');if(f)f.value=S.num;update()}};
function mergeAr(a){let n=0;a.forEach(o=>{if(!o||!o.code||!o.s||!Array.isArray(o.s.items))return;const i=AR.findIndex(x=>x.code===o.code);
  if(i<0)AR.push(o);else if((o.ts||0)>(AR[i].ts||0))AR[i]=o;else return;n++});AR.sort((x,y)=>(y.ts||0)-(x.ts||0));saveAr();return n}
function arRows(q){q=(q||'').trim().toLowerCase();const a=AR.filter(x=>!q||[x.code,x.buyer,x.supplier,x.total,x.date,ruDate(x.date)].join(' ').toLowerCase().includes(q));
  return a.length?a.map(x=>`<div class="co"><div><b class="ar-code">${E(x.code)}</b><br><small>${E([ruDate(x.date),x.buyer||'без покупателя',x.total,x.kind==='print'?'печать':'Word'].join(', '))}</small></div><button class="add" data-aropen="${E(x.code)}">Открыть</button><button class="x" data-ardel="${E(x.code)}" title="Удалить">✕</button></div>`).join(''):'<p style="color:var(--mut)">'+(AR.length?'По этому запросу ничего не найдено':'Архив пуст. Счета попадают сюда после скачивания или печати.')+'</p>'}
function showAr(q){VIEW='ar';$('#mc').innerHTML=`<h3>Архив счетов</h3><div class="ar-s"><input id="arq" placeholder="Шифр, например 2611-007K" value="${E(q||'')}" autocomplete="off"><button class="main" data-arfind>Найти</button></div><div id="arl">${arRows(q)}</div><div class="bar2"><button class="add" data-close>Закрыть</button><button class="x" data-arclear>Очистить архив</button></div>`;$('#arq').focus()}
$('#bAr').onclick=()=>{$('#mod').hidden=false;showAr()};
$('#mc').addEventListener('input',e=>{if(e.target.id==='arq')$('#arl').innerHTML=arRows(e.target.value)});
$('#mc').addEventListener('keydown',e=>{if(e.target.id==='arq'&&e.key==='Enter')$('#arl').innerHTML=arRows(e.target.value)});
$('#mod').addEventListener('click',e=>{const t=e.target.closest('button'),d=t&&t.dataset;if(!d)return;
  if('arfind' in d)$('#arl').innerHTML=arRows($('#arq').value);
  else if(d.aropen){const x=AR.find(a=>a.code===d.aropen);if(!x)return;S=Object.assign(blank(),x.s);S.img={};buildForm();$('#mod').hidden=true;toast('Открыт счёт '+x.code+' (печать и подпись нужно загрузить заново)')}
  else if(d.ardel){if(confirm('Удалить счёт '+d.ardel+' из архива?')){AR=AR.filter(a=>a.code!==d.ardel);saveAr();if(S.num===d.ardel)renum();showAr($('#arq').value)}}
  else if('arclear' in d){if(AR.length&&confirm('Удалить все счета из архива? Нумерация начнётся заново.')){AR=[];saveAr();renum();showAr()}}});
if(!S.num)S.num=nextNum(S.date);

/* ============ Общий JSON и анимация нажатий ============ */
function expAll(){if(!CO.length&&!AR.length)return toast('Справочник и архив пусты');const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,companies:CO,archive:AR},null,2)],{type:'application/json'}));a.download='kompanii-i-arhiv.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Сохранено: компаний '+CO.length+', счетов в архиве '+AR.length)}
function impPick(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{if(!i.files[0])return;const fr=new FileReader();fr.onload=()=>{try{impCO(fr.result)}catch(x){toast('Не удалось прочитать файл: нужен JSON с компаниями и архивом')}};fr.readAsText(i.files[0])};i.click()}
$('#bExp').onclick=expAll;$('#bImp').onclick=impPick;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,.btn');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,x=document.createElement('span');
  x.className='rp';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),700)});
buildForm();
</script><script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body></html>
